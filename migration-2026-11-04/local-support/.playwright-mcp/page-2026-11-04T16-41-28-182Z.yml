            - generic "Broker" [ref=e306]:
              - generic [ref=e307]: B
              - text: Broker
            - paragraph [ref=e308]: A brokerage firm, also called a broker-dealer, is in the business of buying and selling securities – stocks, bonds, mutual funds, and certain other investment products – on behalf of its customer (as broker), for its own bank (dealer), or both. Individuals who work for broker-dealers - the sales personnel are commonly referred to as brokers.
          - generic [ref=e309]:
            - generic "Investment Adviser" [ref=e310]:
              - generic [ref=e311]: IA
              - text: Investment Adviser
            - paragraph [ref=e312]:
              - text: An investment adviser is paid for providing advice about securities to clients. In addition, some investment advisers manage investment portfolios and offer financial planning services. It is common for a financial professional to act as both a broker and an investment adviser. Because of this, we include investment advisers on BrokerCheck, and provide links to the
              - link "SEC's Investment Adviser Public Disclosure (IAPD) website" [ref=e313] [cursor=pointer]:
                - /url: https://adviserinfo.sec.gov/
              - text: so you can research further.
          - generic [ref=e314]:
            - generic "Previously Registered" [ref=e315]:
              - generic [ref=e316]: PR
              - text: Previously Registered
            - paragraph [ref=e317]:
              - text: A Previously Registered broker or brokerage firm is not currently licensed to act as a broker (buying and selling securities on behalf of customers) or as an investment adviser (providing advice about securities to clients). They may still be able to offer other investment-related services if properly licensed to do so. Click
              - link "here" [ref=e318] [cursor=pointer]:
                - /url: http://www.finra.org/investors/choosing-investment-professional
              - text: to learn more.
