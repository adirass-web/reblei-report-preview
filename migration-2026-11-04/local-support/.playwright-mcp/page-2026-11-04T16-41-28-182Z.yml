            - listitem [ref=e293]: Ensure the individual or firm is registered with FINRA, the Securities and Exchange Commission (SEC), or a state securities regulator. Also, Individuals are removed from BrokerCheck if they have been out of the industry for at least 10 years, except in cases where regulatory sanctions or criminal activity have occurred, in which case inclusion in BrokerCheck is permanent. Once registered, firms are included in BrokerCheck permanently even if its registration has lapsed or been revoked.
