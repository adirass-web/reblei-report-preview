          - paragraph [ref=f2e97]:
            - generic [ref=f2e98]:
              - text: For a complete compilation of Investment Adviser Firms currently registered with the SEC and states securities regulators, download the
              - link "Investment Adviser Data" [ref=f2e99] [cursor=pointer]:
                - /url: https://adviserinfo.sec.gov/compilation
              - text: .
          - paragraph [ref=f2e100]: You can search for an Investment Adviser firm on this website and view the registration or reporting form ("Form ADV") that the adviser filed. This website will also search FINRA's BrokerCheck system and indicate whether an entity is a Brokerage firm. Investment advisers file Form ADV to register with the SEC and/or the states. Some advisers that do not have to register with the SEC or the states ("Exempt Reporting Advisers") must nonetheless complete some of the questions in Form ADV for purposes of reporting to the SEC and/or the states. Form ADV contains information about an investment adviser and its business operations. Additionally, it contains disclosure about certain disciplinary events involving the adviser and its key personnel.
          - paragraph [ref=f2e101]: You can also search for an individual investment adviser representative and view that individual's professional background and conduct, including current registrations, employment history, and disclosures about certain disciplinary events involving the individual. The information about investment adviser representatives that appears on this website is collected from individual Investment Adviser Representatives, Investment Adviser firm(s), and/or securities regulator(s) as part of the securities industry's registration and licensing process. Individuals that are Registered Representatives of a Brokerage firm that are listed in FINRA's BrokerCheck system will also appear in search results.
          - paragraph [ref=f2e102]: Are you having technical difficulties using the Investment Adviser Public Disclosure site?
          - paragraph [ref=f2e103]: You can call 240-386-4848 for technical assistance.
          - paragraph [ref=f2e104]: You can also Schedule a Call with the FINRA Support Center
          - generic [ref=f2e105]: Learn More About IAPD
