            - paragraph [ref=f2e16]: ⚠️ Be Alert!
            - paragraph [ref=f2e17]: "When investing, be alert to these common scams:"
            - list [ref=f2e18]:
              - listitem [ref=f2e19]:
                - strong [ref=f2e20]: Investment Offers Implying SEC Endorsement
                - text: – Fraudsters may refer to the SEC as a way of convincing potential investors that the fraudulent investment opportunity is legitimate. The SEC does not “approve” or “endorse” any particular securities, issuers, products, services, professional credentials, firms, or individuals, and does not allow private entities to use its government seal.
                - link "Read the full alert on investment offers implying SEC Endorsement [investor.gov]" [ref=f2e21] [cursor=pointer]:
                  - /url: https://www.investor.gov/introduction-investing/general-resources/news-alerts/alerts-bulletins/investor-alerts/investor-54
              - listitem [ref=f2e22]:
                - strong [ref=f2e23]: Relationship Investment Scams
                - text: – Fraudsters may exploit personal or professional relationships to gain trust and convince you to invest in fraudulent schemes. Always verify credentials and never rely solely on personal connections.
                - link "Learn more about relationship scams [investor.gov]" [ref=f2e24] [cursor=pointer]:
                  - /url: https://www.investor.gov/protect-your-investments/fraud/types-fraud/relationship-investment-scam
              - listitem [ref=f2e25]:
                - strong [ref=f2e26]: Impersonation of Professionals and Firms
                - text: – Scammers often pose as legitimate investment professionals or well-known firms using fake websites, encrypted message apps, emails, or social media profiles. Confirm identities through official regulatory resources like the SEC’s
                - link "IAPD [adviserinfo.sec.gov]" [ref=f2e27] [cursor=pointer]:
                  - /url: https://adviserinfo.sec.gov
                - text: or FINRA
                - link "BrokerCheck" [ref=f2e28] [cursor=pointer]:
                  - /url: https://brokercheck.finra.org
                - text: before sending money or sharing personal information.
                - link "Read the full alert on impersonation fraud [investor.gov]" [ref=f2e29] [cursor=pointer]:
                  - /url: https://www.investor.gov/protect-your-investments/fraud/types-fraud/impersonation-schemes
            - paragraph [ref=f2e30]:
              - strong [ref=f2e31]: "Tip: Avoid pressure tactics, be wary of urgent requests and be cautious of unsolicited offers."
