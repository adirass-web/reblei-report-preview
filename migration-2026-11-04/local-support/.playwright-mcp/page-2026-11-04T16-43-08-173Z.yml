                - listitem [ref=f2e183]: Make sure that you have spelled the name of the individual or firm correctly. If you are uncertain as to the complete spelling, try spelling just the first part of the name. If you know their IARD/CRD number or SEC "801-" or “802-" number, enter it.
                - listitem [ref=f2e184]: Call (240) 386-4848 or send an email to IARD@finra.org for technical assistance in performing your search.
                - listitem [ref=f2e185]: Contact your state regulator [nasaa.org] or the SEC at (202) 551-7250 to check if the individual or firm that you are searching for has a pending application for registration or registered via paper filings instead of filing electronically through this system.
