   </g>
   <g id="text_14">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #172b40" transform="translate(78.048 540.234477)">Order date / filing date: motion moot, case disposed.</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #172b40" transform="translate(78.048 554.583665)">No requested money award appears.</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b7280" x="81.252" y="617.416849" transform="rotate(-0 81.252 617.416849)">SEPARATE ADMINISTRATIVE INSET — DECEMBER 9–10, 2020</text>
   </g>
   <g id="text_16">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #172b40" transform="translate(81.252 646.983405)">Voluntary neutral-evaluation mailing, then next-day correction:</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #172b40" transform="translate(81.252 662.700311)">erroneously sent to disposed matters; disregard / no further action.</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #172b40" transform="translate(81.252 678.417218)">No reopening or later accrual established.</text>
   </g>
  </g>
