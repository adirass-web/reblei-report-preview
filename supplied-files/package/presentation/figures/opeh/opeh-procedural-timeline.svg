   <g id="text_1">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2563a6" x="78.048" y="130.221549" transform="rotate(-0 78.048 130.221549)">JAN 11, 2018</text>
   </g>
   <g id="text_2">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #172b40" transform="translate(78.048 150.843501)">Note as of date; delivery/loan alleged.</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #172b40" transform="translate(78.048 165.192689)">Predecessor and guaranty recital qualifies funding description.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2563a6" x="78.048" y="195.120045" transform="rotate(-0 78.048 195.120045)">SEP 1, 2018</text>
   </g>
   <g id="text_4">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #172b40" transform="translate(78.048 215.741997)">Scheduled maturity; earlier transfer unknown.</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #172b40" transform="translate(78.048 230.091185)">Subsequent Business Day clause applies to payment.</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2563a6" x="78.048" y="260.018541" transform="rotate(-0 78.048 260.018541)">SEP 17, 2018</text>
   </g>
   <g id="text_6">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #172b40" transform="translate(78.048 280.640493)">Asserted accounting cutoff / requested interest start.</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #172b40" transform="translate(78.048 294.98968)">Day-boundary convention unresolved.</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2563a6" x="78.048" y="324.917037" transform="rotate(-0 78.048 324.917037)">SEP 25–27, 2018</text>
   </g>
   <g id="text_8">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #172b40" transform="translate(78.048 345.538989)">Demand Sep 25; affidavit apparently sworn Sep 26;</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #172b40" transform="translate(78.048 359.888177)">summons and CPLR 3213 motion filed Sep 27.</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2563a6" x="78.048" y="389.815533" transform="rotate(-0 78.048 389.815533)">OCT 17, 2018</text>
   </g>
   <g id="text_10">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172b40" x="78.048" y="410.437485" transform="rotate(-0 78.048 410.437485)">Notice discontinues without prejudice and without costs.</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2563a6" x="78.048" y="454.714029" transform="rotate(-0 78.048 454.714029)">NOV 20 / 28, 2018</text>
   </g>
   <g id="text_12">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #172b40" transform="translate(78.048 475.335981)">Administrative notice / working-copy adjournment.</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #172b40" transform="translate(78.048 489.685169)">No monetary ruling recorded.</text>
   </g>
   <g id="text_13">
