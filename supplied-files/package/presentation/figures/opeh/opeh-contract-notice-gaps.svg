   <g id="text_1">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b46a00" x="71.64" y="159.488209" transform="rotate(-0 71.64 159.488209)">MATURITY — scheduled or earlier transfer</text>
   </g>
   <g id="text_2">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #172b40" transform="translate(71.64 189.054765)">September 1, 2018; earlier property sale/transfer unknown.</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #172b40" transform="translate(71.64 204.771671)">Non-Business Day payment shifts to the subsequent Business Day.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #7953a6" x="71.64" y="262.597969" transform="rotate(-0 71.64 262.597969)">PAYMENT DEFAULT — applicable cure</text>
   </g>
   <g id="text_4">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #172b40" transform="translate(71.64 292.164525)">Ten Business Days to cure payment default.</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #172b40" transform="translate(71.64 307.881431)">Operative due date and applicable holiday/closure calendar unresolved.</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #7953a6" x="71.64" y="365.707729" transform="rotate(-0 71.64 365.707729)">OTHER COVENANT DEFAULT — written notice</text>
   </g>
   <g id="text_6">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #172b40" transform="translate(71.64 395.274285)">Ten Business Days after written notice.</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #172b40" transform="translate(71.64 410.991191)">Distinct from the payment-cure provision.</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b7280" x="71.64" y="468.817489" transform="rotate(-0 71.64 468.817489)">ACCELERATION — delivered written election</text>
   </g>
   <g id="text_8">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #172b40" transform="translate(71.64 498.384045)">Express delivery/election term; section 8 written methods.</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #172b40" transform="translate(71.64 514.100951)">Demand legend / delivery assertion lacks independent receipt or tracking.</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #7953a6" x="71.64" y="571.927249" transform="rotate(-0 71.64 571.927249)">DEFAULT INTEREST — separate condition</text>
   </g>
   <g id="text_10">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #172b40" transform="translate(71.64 601.493805)">15% actual/360, compounded annually, while default continues</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #172b40" transform="translate(71.64 617.210711)">after applicable cure; does not itself resolve notice or waiver interaction.</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; fill: #6b7280" transform="translate(62.028 689.440365)">Unresolved: sections 5/16 waivers ↔ express sections 7/8 notice/election terms.</text>
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; fill: #6b7280" transform="translate(62.028 702.87774)">Notice-dependent calculation: NOT TESTABLE; result remains null.</text>
   </g>
  </g>
  <g id="text_12">
